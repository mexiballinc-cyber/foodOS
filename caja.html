<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Food OS - POS Cajas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- CONEXIÓN A FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDD5YehD45blgPdbDCUEcwSnqBjdA_eZlE",
            authDomain: "food-os-system.firebaseapp.com",
            databaseURL: "https://food-os-system-default-rtdb.firebaseio.com",
            projectId: "food-os-system",
            storageBucket: "food-os-system.firebasestorage.app",
            messagingSenderId: "82413830766",
            appId: "1:82413830766:web:23da82e27ead8b8f2d1c7f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 🛡️ Datos Dinámicos de Sesión desde LocalStorage
        const currentSucursal = localStorage.getItem("foodos_sucursal") || "cubito_sushi";
        const usuarioActivo = localStorage.getItem("foodos_usuario") || "Empleado General"; 
        const sucursalRef = `sucursales/${currentSucursal}`;

        // Inyectar nombres dinámicos en la UI (Elimina "Wendy")
        document.getElementById("nombre-cajero").innerText = usuarioActivo;
        document.getElementById("nombre-sucursal").innerText = currentSucursal.replace("_", " ").toUpperCase();

        // 📂 1. Carga Dinámica de Categorías desde Firebase
        let menuCompleto = {};
        onValue(ref(db, `${sucursalRef}/categorias`), (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById("categories-bar");
            const selectModal = document.getElementById("prod-categoria");
            
            const addBtn = document.getElementById("btn-add-category");
            container.innerHTML = `<button onclick="filtrarCategoria('Todos')" class="btn-raised px-4 py-2 text-xs md:text-sm font-bold whitespace-nowrap">Todos</button>`;
            selectModal.innerHTML = "";

            if (data) {
                Object.keys(data).forEach(key => {
                    const cat = data[key];
                    container.innerHTML += `<button onclick="filtrarCategoria('${cat.nombre}')" class="btn-raised px-4 py-2 text-xs md:text-sm font-bold whitespace-nowrap">${cat.nombre}</button>`;
                    selectModal.innerHTML += `<option value="${cat.nombre}">${cat.nombre}</option>`;
                });
            }
            container.appendChild(addBtn);
        });

        // 📥 2. Carga Dinámica del Menú desde Firebase
        onValue(ref(db, `${sucursalRef}/menu`), (snapshot) => {
            menuCompleto = snapshot.val() || {};
            renderizarProductos(menuCompleto);
        });

        window.renderizarProductos = function(productos) {
            const grid = document.getElementById("products-grid");
            grid.innerHTML = "";

            if (Object.keys(productos).length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-medium text-sm">El menú está vacío.<br>Usa el lápiz para agregar platillos.</div>`;
                return;
            }

            Object.keys(productos).forEach(id => {
                const item = productos[id];
                grid.innerHTML += `
                    <div onclick="agregarAlTicket('${item.nombre}', ${item.precio})" class="btn-raised p-3 flex flex-col justify-between h-32 md:h-40 cursor-pointer relative overflow-hidden group">
                        <img src="${item.foto}" class="absolute inset-0 w-full h-full object-cover opacity-20 group-hover:opacity-40 transition-opacity" />
                        <span class="text-[10px] md:text-xs font-bold uppercase tracking-wider text-amber-400 z-10">${item.categoria}</span>
                        <div class="z-10">
                            <p class="font-bold text-sm md:text-base leading-tight">${item.nombre}</p>
                            <p class="text-base md:text-lg font-black text-emerald-400 mt-1">$${item.precio} MXN</p>
                        </div>
                    </div>
                `;
            });
        };

        // 🔍 Filtrar por Categoría (Botones de arriba)
        window.filtrarCategoria = function(nombreCat) {
            if (nombreCat === 'Todos') {
                renderizarProductos(menuCompleto);
            } else {
                const filtrados = {};
                Object.keys(menuCompleto).forEach(key => {
                    if (menuCompleto[key].categoria === nombreCat) {
                        filtrados[key] = menuCompleto[key];
                    }
                });
                renderizarProductos(filtrados);
            }
        };

        // ✏️ AÑADIR PLATILLO (Gerente)
        document.getElementById("form-nuevo-producto").addEventListener("submit", (e) => {
            e.preventDefault();
            const nuevoPlatillo = {
                nombre: document.getElementById("prod-nombre").value,
                precio: parseFloat(document.getElementById("prod-precio").value),
                categoria: document.getElementById("prod-categoria").value,
                foto: document.getElementById("prod-foto").value,
                ingredientes: document.getElementById("prod-ingredientes").value
            };

            push(ref(db, `${sucursalRef}/menu`), nuevoPlatillo).then(() => {
                alert("✅ Platillo agregado a Firebase.");
                document.getElementById("form-nuevo-producto").reset();
                cerrarModalProducto();
            });
        });

        // 📂 AÑADIR CATEGORÍA (Gerente)
        window.guardarCategoriaServer = function() {
            const nombre = prompt("Nombre de la nueva categoría:");
            if (nombre) {
                push(ref(db, `${sucursalRef}/categorias`), { nombre });
            }
        };

        window.cerrarSesion = function() {
            localStorage.clear();
            window.location.href = "index.html";
        };
    </script>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e2640 100%);
            --text-color: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --shadow-raised: 6px 6px 12px rgba(0, 0, 0, 0.4), -3px -3px 8px rgba(255, 255, 255, 0.05);
            --shadow-sunken: inset 3px 3px 6px rgba(0, 0, 0, 0.5), inset -2px -2px 4px rgba(255, 255, 255, 0.05);
        }

        .light-mode {
            --bg-gradient: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            --text-color: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.8);
            --shadow-raised: 5px 5px 10px rgba(0, 0, 0, 0.15), -3px -3px 8px rgba(255, 255, 255, 0.9);
            --shadow-sunken: inset 3px 3px 5px rgba(0, 0, 0, 0.15), inset -2px -2px 4px rgba(255, 255, 255, 0.8);
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            transition: background 0.3s ease;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
        }

        .btn-raised {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: var(--shadow-raised);
        }
        .btn-raised:active { transform: translateY(2px); box-shadow: var(--shadow-sunken); }

        .btn-sunken {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            box-shadow: var(--shadow-sunken);
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="p-2 md:p-4 flex flex-col gap-3 h-screen overflow-hidden">

    <!-- HEADER RESPONSIVE -->
    <header class="glass-panel h-14 md:h-16 px-4 md:px-6 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-2 md:gap-3 overflow-hidden">
            <span class="text-xl md:text-2xl">🍣</span>
            <div class="flex flex-col">
                <h1 class="text-xs md:text-lg font-black leading-tight truncate" id="nombre-sucursal">Cargando...</h1>
                <span class="text-[10px] md:text-xs text-amber-400 font-bold" id="nombre-cajero">Cajero</span>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button id="btn-edit-mode" onclick="toggleModoEdicion()" class="w-9 h-9 md:w-11 md:h-11 btn-sunken flex items-center justify-center text-base md:text-lg text-amber-400">✏️</button>
            <button onclick="toggleTema()" id="btn-theme" class="w-9 h-9 md:w-11 md:h-11 btn-sunken flex items-center justify-center text-base md:text-lg">🌙</button>
            <button onclick="cerrarSesion()" class="w-9 h-9 md:w-11 md:h-11 btn-sunken flex items-center justify-center text-base md:text-lg text-rose-400">✕</button>
        </div>
    </header>

    <!-- PANEL PRINCIPAL (FLEX COL EN MÓVIL VERTICAL / FLEX ROW EN HORIZONTAL & DESKTOP) -->
    <main class="flex-1 flex flex-col md:flex-row gap-3 overflow-hidden">
        
        <!-- PANEL TICKET (Arriba en celular vertical / Izquierda en Horizontal y Desktop) -->
        <section class="glass-panel w-full md:w-5/12 h-1/2 md:h-full flex flex-col p-3 md:p-5 gap-2 md:gap-3 shrink-0">
            <div class="flex justify-between items-center border-b border-white/10 pb-2">
                <h2 class="text-base md:text-xl font-black">info orden</h2>
                <span class="text-xs font-bold text-sky-400" id="total-items">0 items</span>
            </div>

            <div id="ticket-items" class="flex-1 overflow-y-auto space-y-2 pr-1">
                <!-- Se llena al dar clic a platillos -->
            </div>
            
            <div class="border-t border-white/10 pt-2">
                <div class="flex justify-between items-baseline mb-2">
                    <span class="text-xs uppercase font-bold opacity-70">Total MXN</span>
                    <span class="text-2xl md:text-3xl font-black text-emerald-400" id="total-mxn">$0.00</span>
                </div>
                
                <!-- Botones Acción Compactos para Celular -->
                <div class="grid grid-cols-3 gap-1.5 text-[10px] md:text-xs">
                    <button class="btn-raised py-2 font-bold uppercase">Domicilio</button>
                    <button class="btn-raised py-2 font-bold uppercase">Llevar</button>
                    <button class="btn-raised py-2 font-bold uppercase">Comedor</button>
                    <button class="btn-raised py-2 font-bold uppercase text-sky-400">Enviar</button>
                    <button class="btn-raised py-2 font-bold uppercase text-emerald-400">Pago</button>
                    <button onclick="abrirModalProducto()" id="btn-add-prod-quick" class="btn-raised py-2 text-base font-bold text-amber-300 bg-amber-500/10">+</button>
                </div>
            </div>
        </section>

        <!-- PANEL CATÁLOGOS Y PLATILLOS (Abajo en celular vertical / Derecha en Horizontal) -->
        <section class="glass-panel w-full md:w-7/12 h-1/2 md:h-full flex flex-col p-3 md:p-5 gap-3 overflow-hidden">
            
            <!-- Categorías con Scroll Horizontal Fina -->
            <div class="flex items-center gap-2 overflow-x-auto pb-1 shrink-0" id="categories-bar">
                <button onclick="filtrarCategoria('Todos')" class="btn-raised px-4 py-2 text-xs md:text-sm font-bold whitespace-nowrap">Todos</button>
                <button id="btn-add-category" onclick="guardarCategoriaServer()" class="hidden btn-sunken px-3 py-1.5 text-amber-400 font-bold text-xs shrink-0">+ Categoria</button>
            </div>

            <!-- Grilla Responsive (2 cols en celular, 3 en Tablet, 3 en PC) -->
            <div class="flex-1 overflow-y-auto pr-1">
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 md:gap-3" id="products-grid">
                    <!-- Se carga dinámicamente desde Firebase -->
                </div>
            </div>
        </section>
    </main>

    <!-- MODAL AGREGAR PLATILLO (GERENTE) -->
    <div id="modal-agregar-producto" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="glass-panel w-full max-w-md p-5 space-y-3">
            <h3 class="text-lg font-black text-amber-400 border-b border-white/10 pb-2">➕ Agregar Nuevo Platillo</h3>
            <form id="form-nuevo-producto" class="space-y-2 text-xs md:text-sm">
                <div>
                    <label class="block text-slate-400 text-[10px] mb-1">Nombre</label>
                    <input type="text" id="prod-nombre" required class="btn-sunken w-full px-3 py-2 text-white outline-none" placeholder="Ej. Dragón Roll">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 text-[10px] mb-1">Precio ($ MXN)</label>
                        <input type="number" id="prod-precio" step="0.01" required class="btn-sunken w-full px-3 py-2 text-white outline-none" placeholder="180">
                    </div>
                    <div>
                        <label class="block text-slate-400 text-[10px] mb-1">Categoría</label>
                        <select id="prod-categoria" class="btn-sunken w-full px-3 py-2 text-white outline-none bg-slate-900"></select>
                    </div>
                </div>
                <div>
                    <label class="block text-slate-400 text-[10px] mb-1">URL Foto (Imagen)</label>
                    <input type="url" id="prod-foto" required class="btn-sunken w-full px-3 py-2 text-white outline-none" placeholder="https://...">
                </div>
                <div>
                    <label class="block text-slate-400 text-[10px] mb-1">Ingredientes (Cocina)</label>
                    <textarea id="prod-ingredientes" rows="2" class="btn-sunken w-full p-2 text-white outline-none" placeholder="Ingredientes y notas..."></textarea>
                </div>
                
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="cerrarModalProducto()" class="btn-raised w-1/2 py-2 font-bold">Cancelar</button>
                    <button type="submit" class="btn-raised w-1/2 py-2 font-bold text-amber-300 bg-amber-500/20">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT DE TICKET Y TEMAS -->
    <script>
        let total = 0;
        let countItems = 0;
        let esModoClaro = false;

        function toggleTema() {
            esModoClaro = !esModoClaro;
            document.body.classList.toggle("light-mode");
            document.getElementById("btn-theme").innerText = esModoClaro ? "☀️" : "🌙";
        }

        function toggleModoEdicion() {
            const btnAdd = document.getElementById("btn-add-category");
            btnAdd.classList.toggle("hidden");
            if(!btnAdd.classList.contains("hidden")) {
                abrirModalProducto();
            }
        }

        function agregarAlTicket(nombre, precio) {
            total += precio;
            countItems++;
            document.getElementById("total-mxn").innerText = `$${total.toFixed(2)}`;
            document.getElementById("total-items").innerText = `${countItems} items`;
            
            const ticket = document.getElementById("ticket-items");
            ticket.innerHTML += `
                <div class="flex justify-between items-center btn-sunken p-2 text-xs">
                    <span class="font-bold truncate max-w-[150px]">${nombre}</span>
                    <span class="font-black text-amber-400">$${precio}</span>
                </div>
            `;
        }

        function abrirModalProducto() { document.getElementById("modal-agregar-producto").classList.remove("hidden"); }
        function cerrarModalProducto() { document.getElementById("modal-agregar-producto").classList.add("hidden"); }
    </script>
</body>
</html>
