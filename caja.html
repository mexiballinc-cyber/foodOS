<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Food OS - POS Cajas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, get, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDD5YehD45blgPdbDCUEcwSnqBjdA_eZlE",
            authDomain: "food-os-system.firebaseapp.com",
            databaseURL: "https://food-os-system-default-rtdb.firebaseio.com",
            projectId: "food-os-system",
            storageBucket: "food-os-system.firebasestorage.app",
            messagingSenderId: "82413830766",
            appId: "1:82413830766:web:23da82e27ead8b8f2d1c7f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 🛡️ SESIÓN Y RECONOCIMIENTO DE ROL DINÁMICO
        const currentSucursal = localStorage.getItem("foodos_business_token") || localStorage.getItem("foodos_sucursal") || "cubito_sushi";
        const usuarioActivo = localStorage.getItem("foodos_user_name") || localStorage.getItem("foodos_usuario") || "Cajero General"; 
        
        const rawRole = (localStorage.getItem("foodos_role") || "").toLowerCase();
        const esGerente = ["admin", "gerente", "owner", "administrador"].includes(rawRole) || localStorage.getItem("foodos_es_gerente") === "true";

        const sucursalRef = `businesses/${currentSucursal}`;
        window.db = db;
        window.sucursalRef = sucursalRef;
        window.esGerente = esGerente;

        // 🏬 NOMBRE DE LOCAL Y CAJERO
        onValue(ref(db, `${sucursalRef}/config/nombreLocal`), (snapshot) => {
            const nombreReal = snapshot.val();
            document.getElementById("nombre-sucursal").innerText = (nombreReal || currentSucursal.replace(/_/g, " ")).toUpperCase();
        });

        document.getElementById("nombre-cajero").innerText = `${usuarioActivo} (${rawRole || 'caja'})`;

        if (esGerente) {
            document.querySelectorAll(".solo-gerente").forEach(el => el.classList.remove("hidden"));
        }

        // 📂 CATEGORÍAS
        window.menuCompleto = {};
        onValue(ref(db, `${sucursalRef}/categorias`), (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById("categories-bar");
            const selectModal = document.getElementById("prod-categoria");
            
            container.innerHTML = `<button onclick="filtrarCategoria('Todos')" class="btn-raised px-4 py-2 text-xs md:text-sm font-bold whitespace-nowrap active:scale-95">Todos</button>`;
            selectModal.innerHTML = "";

            if (data) {
                Object.keys(data).forEach(key => {
                    const cat = data[key];
                    container.innerHTML += `<button onclick="filtrarCategoria('${cat.nombre}')" class="btn-raised px-4 py-2 text-xs md:text-sm font-bold whitespace-nowrap active:scale-95">${cat.nombre}</button>`;
                    selectModal.innerHTML += `<option value="${cat.nombre}">${cat.nombre}</option>`;
                });
            }
        });

        // 📥 MENÚ
        onValue(ref(db, `${sucursalRef}/menu`), (snapshot) => {
            window.menuCompleto = snapshot.val() || {};
            renderizarProductos(window.menuCompleto);
        });

        // 🍳 CARGAR COCINAS EN MODAL
        onValue(ref(db, `${sucursalRef}/cocinas`), (snapshot) => {
            const data = snapshot.val() || {};
            const selectCocina = document.getElementById("prod-cocina");
            if(selectCocina) {
                selectCocina.innerHTML = '<option value="general">Cocina Principal</option>';
                Object.keys(data).forEach(k => {
                    selectCocina.innerHTML += `<option value="${k}">${data[k].nombre}</option>`;
                });
            }
        });

        // ✏️ AÑADIR PLATILLO (Gerente)
        document.getElementById("form-nuevo-producto").addEventListener("submit", (e) => {
            e.preventDefault();
            const nuevoPlatillo = {
                nombre: document.getElementById("prod-nombre").value,
                precio: parseFloat(document.getElementById("prod-precio").value),
                categoria: document.getElementById("prod-categoria").value,
                cocina: document.getElementById("prod-cocina").value,
                foto: document.getElementById("prod-foto").value,
                ingredientes: document.getElementById("prod-ingredientes").value
            };

            push(ref(db, `${sucursalRef}/menu`), nuevoPlatillo).then(() => {
                document.getElementById("form-nuevo-producto").reset();
                cerrarModalProducto();
            });
        });

        window.cerrarSesion = function() {
            localStorage.clear();
            window.location.href = "index.html";
        };
    </script>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e2640 100%);
            --text-color: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --shadow-raised: 6px 6px 12px rgba(0, 0, 0, 0.4), -3px -3px 8px rgba(255, 255, 255, 0.05);
            --shadow-sunken: inset 3px 3px 6px rgba(0, 0, 0, 0.5), inset -2px -2px 4px rgba(255, 255, 255, 0.05);
            --input-bg: rgba(0, 0, 0, 0.4);
        }

        .light-mode {
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            --text-color: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(203, 213, 225, 0.6);
            --shadow-raised: 5px 5px 12px rgba(148, 163, 184, 0.35), -4px -4px 10px rgba(255, 255, 255, 0.9);
            --shadow-sunken: inset 3px 3px 6px rgba(148, 163, 184, 0.3), inset -3px -3px 6px rgba(255, 255, 255, 0.9);
            --input-bg: #e2e8f0;
        }

        body, .glass-panel, .btn-raised, .btn-sunken, header, main, section {
            transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            user-select: none;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
        }

        .btn-raised {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: var(--shadow-raised);
            color: var(--text-color);
        }

        .btn-sunken {
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-shadow: var(--shadow-sunken);
            color: var(--text-color);
        }

        button:active, .btn-raised:active, .btn-sunken:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="p-2 md:p-4 flex flex-col gap-3 h-screen overflow-hidden">

    <!-- HEADER DINÁMICO -->
    <header class="glass-panel h-14 md:h-16 px-4 md:px-6 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-2 md:gap-3 overflow-hidden">
            <span class="text-xl md:text-2xl">🍣</span>
            <div class="flex flex-col">
                <h1 class="text-xs md:text-lg font-black truncate text-amber-500" id="nombre-sucursal">OBTENIENDO NOMBRE...</h1>
                <div class="flex items-center gap-1">
                    <span class="text-[10px] md:text-xs text-slate-400 font-bold" id="nombre-cajero">Cajero</span>
                    <span id="badge-gerente" class="solo-gerente hidden text-[9px] bg-amber-500/20 text-amber-500 border border-amber-500/30 px-2 py-0.5 rounded-full font-extrabold uppercase">Gerente</span>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button id="btn-edit-mode" onclick="toggleModoGerente()" class="solo-gerente hidden w-9 h-9 md:w-11 md:h-11 btn-sunken flex items-center justify-center text-base md:text-lg text-amber-500 active:scale-90" title="Modo Gerente">✏️</button>
            <button onclick="toggleTema()" id="btn-theme" class="w-9 h-9 md:w-11 md:h-11 btn-sunken flex items-center justify-center text-base md:text-lg">🌙</button>
            <button onclick="cerrarSesion()" class="w-9 h-9 md:w-11 md:h-11 btn-sunken flex items-center justify-center text-base md:text-lg text-rose-500">✕</button>
        </div>
    </header>

    <!-- PANEL PRINCIPAL -->
    <main class="flex-1 flex flex-col md:flex-row gap-3 overflow-hidden">
        
        <!-- COMANDA TICKET -->
        <section class="glass-panel w-full md:w-5/12 h-1/2 md:h-full flex flex-col p-3 md:p-5 gap-2 shrink-0">
            <div class="flex justify-between items-center border-b border-black/10 dark:border-white/10 pb-2">
                <h2 class="text-base md:text-xl font-black">Info Orden</h2>
                <span class="text-[10px] text-slate-400">Doble clic para notas/cambio</span>
            </div>

            <div id="ticket-items" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
            
            <div class="border-t border-black/10 dark:border-white/10 pt-2">
                <div class="flex justify-between items-baseline mb-2">
                    <span class="text-xs uppercase font-bold opacity-70">Total MXN</span>
                    <span class="text-2xl md:text-3xl font-black text-emerald-500" id="total-mxn">$0.00</span>
                </div>
                
                <div class="grid grid-cols-3 gap-1.5 text-[10px] md:text-xs">
                    <button onclick="verOrdenesPorTipo('domicilio')" class="btn-raised py-2 font-bold uppercase">Domicilio</button>
                    <button onclick="verOrdenesPorTipo('llevar')" class="btn-raised py-2 font-bold uppercase">Llevar</button>
                    <button onclick="verOrdenesPorTipo('comedor')" class="btn-raised py-2 font-bold uppercase">Comedor</button>
                    <button onclick="procesarEnvio()" class="btn-raised py-2 font-bold uppercase text-sky-500">Enviar</button>
                    <button onclick="cobrarOrdenDirecta()" class="btn-raised py-2 font-bold uppercase text-emerald-500">Pago</button>
                    <button onclick="abrirModalMas()" class="btn-raised py-2 text-base font-bold text-amber-500 bg-amber-500/10">+</button>
                </div>
            </div>
        </section>

        <!-- PANEL PRODUCTOS -->
        <section class="glass-panel w-full md:w-7/12 h-1/2 md:h-full flex flex-col p-3 md:p-5 gap-3 overflow-hidden">
            <div class="flex items-center gap-2 overflow-x-auto pb-1 shrink-0" id="categories-bar">
                <button onclick="filtrarCategoria('Todos')" class="btn-raised px-4 py-2 text-xs md:text-sm font-bold whitespace-nowrap">Todos</button>
            </div>

            <div class="flex-1 overflow-y-auto pr-1">
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 md:gap-3" id="products-grid"></div>
            </div>
        </section>
    </main><!-- MODAL OPCIONES POS (+) -->
    <div id="modal-menu-mas" class="hidden fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="glass-panel w-full max-w-sm p-5 space-y-3">
            <div class="flex justify-between items-center border-b border-black/10 dark:border-white/10 pb-2">
                <h3 class="text-base font-black text-amber-500">Opciones POS</h3>
                <button onclick="cerrarModalMas()" class="btn-sunken w-7 h-7 text-xs">✕</button>
            </div>
            
            <div class="space-y-2 text-xs font-bold">
                <button onclick="alert('Cargando resumen de órdenes...')" class="btn-raised w-full p-3 text-left">📜 Todas las Órdenes del Día</button>
                <button onclick="alert('Abriendo sección Repas...')" class="btn-raised w-full p-3 text-left">🛵 Pedidos Repas & Puente</button>
                <button onclick="alert('Generando Corte...')" class="btn-raised w-full p-3 text-left text-emerald-500">💵 Realizar Corte General</button>

                <div id="seccion-modal-gerente" class="solo-gerente hidden border-t border-black/10 dark:border-white/10 pt-2 space-y-2">
                    <p class="text-[10px] text-amber-500 uppercase tracking-widest font-black">Admin Gerente</p>
                    <button onclick="alert('Gestión de Empleados')" class="btn-raised w-full p-3 text-left text-amber-500">👥 Gestión de Empleados</button>
                    <button onclick="alert('Configuración de Cocinas')" class="btn-raised w-full p-3 text-left text-amber-500">🍳 Configuración de Cocinas</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL AGREGAR PLATILLO (GERENTE) -->
    <div id="modal-agregar-producto" class="hidden fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="glass-panel w-full max-w-md p-5 space-y-3">
            <h3 class="text-lg font-black text-amber-500 border-b border-black/10 dark:border-white/10 pb-2">➕ Nuevo Platillo</h3>
            <form id="form-nuevo-producto" class="space-y-2 text-xs md:text-sm">
                <input type="text" id="prod-nombre" required class="btn-sunken w-full px-3 py-2 outline-none" placeholder="Nombre del Platillo">
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="prod-precio" step="0.01" required class="btn-sunken w-full px-3 py-2 outline-none" placeholder="Precio ($ MXN)">
                    <select id="prod-categoria" class="btn-sunken w-full px-3 py-2 outline-none bg-slate-900"></select>
                </div>
                <div class="grid grid-cols-1 gap-2">
                    <label class="text-[10px] text-slate-400 font-bold">Enviar comanda a:</label>
                    <select id="prod-cocina" class="btn-sunken w-full px-3 py-2 outline-none bg-slate-900"></select>
                </div>
                <input type="url" id="prod-foto" required class="btn-sunken w-full px-3 py-2 outline-none" placeholder="URL Foto Imagen">
                <textarea id="prod-ingredientes" rows="2" class="btn-sunken w-full p-2 outline-none" placeholder="Ingredientes..."></textarea>
                
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="cerrarModalProducto()" class="btn-raised w-1/2 py-2 font-bold">Cancelar</button>
                    <button type="submit" class="btn-raised w-1/2 py-2 font-bold text-amber-500 bg-amber-500/20">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL INTERCAMBIO DE PRODUCTO O NOTA -->
    <div id="modal-editar-item" class="hidden fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="glass-panel w-full max-w-sm p-5 space-y-3">
            <h3 class="text-base font-black text-amber-500 border-b border-white/10 pb-2">Opciones de Ítem</h3>
            <input type="text" id="input-nota-item" class="btn-sunken w-full p-2 text-xs outline-none" placeholder="Nota para cocina...">
            
            <div>
                <p class="text-[10px] text-amber-400 font-bold uppercase mb-1">🔄 Cambiar por precio equivalente ($<span id="label-precio-cambio">0</span>):</p>
                <div id="lista-cambios-mismo-precio" class="max-h-36 overflow-y-auto space-y-1 pr-1"></div>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="cerrarModalEditarItem()" class="btn-raised w-1/2 py-2 text-xs font-bold">Cancelar</button>
                <button onclick="guardarNotaModal()" class="btn-raised w-1/2 py-2 text-xs font-bold text-emerald-400">Guardar Nota</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT POS LOGIC Y SEGURIDAD -->
    <script>
        let ticketArray = [];
        let esModoClaro = false;
        let modoEdicionActivo = false;
        let itemSeleccionadoId = null;

        document.addEventListener('click', (e) => {
            if (e.target.closest('button, .btn-raised, .btn-sunken')) {
                if (navigator.vibrate) navigator.vibrate(15);
            }
        });

        function toggleTema() {
            esModoClaro = !esModoClaro;
            document.body.classList.toggle("light-mode");
            document.getElementById("btn-theme").innerText = esModoClaro ? "☀️" : "🌙";
        }

        function toggleModoGerente() {
            if (!window.esGerente) return;
            modoEdicionActivo = !modoEdicionActivo;
            document.getElementById("btn-edit-mode").classList.toggle("bg-amber-500/30", modoEdicionActivo);
            renderizarProductos(window.menuCompleto);
        }

        function renderizarProductos(productos) {
            const grid = document.getElementById("products-grid");
            grid.innerHTML = "";

            if (!productos || Object.keys(productos).length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-medium text-sm">No hay productos en esta categoría.</div>`;
            } else {
                Object.keys(productos).forEach(id => {
                    const item = productos[id];
                    grid.innerHTML += `
                        <div onclick="agregarAlTicket('${item.nombre}', ${item.precio})" class="btn-raised p-3 flex flex-col justify-between h-32 md:h-40 cursor-pointer relative overflow-hidden group active:scale-95 transition-transform">
                            <img src="${item.foto}" class="absolute inset-0 w-full h-full object-cover opacity-20 group-hover:opacity-40 transition-opacity" />
                            <span class="text-[10px] md:text-xs font-bold uppercase tracking-wider text-amber-500 z-10">${item.categoria}</span>
                            <div class="z-10">
                                <p class="font-bold text-sm md:text-base leading-tight">${item.nombre}</p>
                                <p class="text-base md:text-lg font-black text-emerald-500 mt-1">$${item.precio} MXN</p>
                            </div>
                        </div>
                    `;
                });
            }

            if (window.esGerente && modoEdicionActivo) {
                grid.innerHTML += `
                    <div onclick="abrirModalProducto()" class="btn-raised p-3 flex flex-col items-center justify-center h-32 md:h-40 cursor-pointer text-amber-500 border-dashed border-2 border-amber-500/50 bg-amber-500/10 active:scale-95">
                        <span class="text-3xl font-black">+</span>
                        <span class="text-xs font-bold uppercase mt-1">Nuevo Platillo</span>
                    </div>
                `;
            }
        }

        function filtrarCategoria(nombreCat) {
            if (nombreCat === 'Todos') {
                renderizarProductos(window.menuCompleto);
            } else {
                const filtrados = {};
                Object.keys(window.menuCompleto).forEach(key => {
                    if (window.menuCompleto[key].categoria === nombreCat) filtrados[key] = window.menuCompleto[key];
                });
                renderizarProductos(filtrados);
            }
        }

        function agregarAlTicket(nombre, precio) {
            ticketArray.push({ id: Date.now(), nombre, precio, nota: "" });
            renderizarTicket();
        }

        function eliminarDelTicket(id) {
            const pin = prompt("🔒 AUTORIZACIÓN GERENTE: Ingresa tu código PIN para cancelar el producto:");
            if (pin === "1234" || window.esGerente) {
                ticketArray = ticketArray.filter(i => i.id !== id);
                renderizarTicket();
            } else {
                alert("❌ PIN Incorrecto. No se puede cancelar el producto sin autorización.");
            }
        }

        function abrirEditarItem(id) {
            itemSeleccionadoId = id;
            const item = ticketArray.find(i => i.id === id);
            if (!item) return;

            document.getElementById("input-nota-item").value = item.nota || "";
            document.getElementById("label-precio-cambio").innerText = item.precio;

            const contenedorCambios = document.getElementById("lista-cambios-mismo-precio");
            contenedorCambios.innerHTML = "";

            Object.keys(window.menuCompleto).forEach(k => {
                const p = window.menuCompleto[k];
                if (p.precio === item.precio && p.nombre !== item.nombre) {
                    contenedorCambios.innerHTML += `
                        <button onclick="sustituirProducto(${id}, '${p.nombre}')" class="btn-sunken w-full p-2 text-left text-xs flex justify-between items-center text-amber-400">
                            <span>${p.nombre}</span>
                            <span class="text-[10px] bg-amber-500/20 px-1.5 py-0.5 rounded">Cambiar 🔄</span>
                        </button>
                    `;
                }
            });

            if (contenedorCambios.innerHTML === "") {
                contenedorCambios.innerHTML = `<p class="text-[10px] text-slate-500 italic">No hay otros productos de $${item.precio} MXN.</p>`;
            }

            document.getElementById("modal-editar-item").classList.remove("hidden");
        }

        function sustituirProducto(id, nuevoNombre) {
            const item = ticketArray.find(i => i.id === id);
            if (item) {
                item.nombre = nuevoNombre;
                renderizarTicket();
                cerrarModalEditarItem();
            }
        }

        function guardarNotaModal() {
            const item = ticketArray.find(i => i.id === itemSeleccionadoId);
            if (item) {
                item.nota = document.getElementById("input-nota-item").value;
                renderizarTicket();
            }
            cerrarModalEditarItem();
        }

        function cerrarModalEditarItem() {
            document.getElementById("modal-editar-item").classList.add("hidden");
        }

        function renderizarTicket() {
            const ticketContainer = document.getElementById("ticket-items");
            ticketContainer.innerHTML = "";
            let total = 0;

            ticketArray.forEach(item => {
                total += item.precio;
                ticketContainer.innerHTML += `
                    <div ondblclick="abrirEditarItem(${item.id})" class="flex flex-col btn-sunken p-2 text-xs relative group cursor-pointer active:scale-98">
                        <div class="flex justify-between items-center">
                            <span class="font-bold truncate max-w-[140px]">${item.nombre}</span>
                            <div class="flex items-center gap-2">
                                <span class="font-black text-amber-500">$${item.precio}</span>
                                <button onclick="eliminarDelTicket(${item.id})" class="text-rose-500 font-bold hover:scale-125 px-1">✕</button>
                            </div>
                        </div>
                        ${item.nota ? `<span class="text-[10px] text-sky-500 italic font-semibold mt-0.5">📝 ${item.nota}</span>` : ''}
                    </div>
                `;
            });

            document.getElementById("total-mxn").innerText = `$${total.toFixed(2)}`;
        }

        function procesarEnvio() {
            if (ticketArray.length === 0) return alert("Añade productos a la comanda primero.");
            const tipo = prompt("¿Para dónde es la orden? (Escribe: comedor, llevar o domicilio):", "comedor")?.toLowerCase();
            if (!["comedor", "llevar", "domicilio"].includes(tipo)) return alert("Tipo inválido.");

            let detalle = "";
            if (tipo === "comedor" || tipo === "llevar") {
                detalle = prompt(`Ingrese el nombre de la persona o número de mesa para ${tipo.toUpperCase()}:`);
                if (!detalle) return;
            }

            alert(`✅ Orden enviada exitosamente a cocina para: ${tipo.toUpperCase()} (${detalle || 'Domicilio'})`);
            ticketArray = [];
            renderizarTicket();
        }

        function verOrdenesPorTipo(tipo) {
            alert(`🔍 Consultando órdenes activas en estado: ${tipo.toUpperCase()}`);
        }

        function cobrarOrdenDirecta() {
            if(ticketArray.length === 0) return alert("No hay productos en la orden.");
            alert("💵 Cobro registrado con éxito.");
            ticketArray = [];
            renderizarTicket();
        }

        function abrirModalProducto() { document.getElementById("modal-agregar-producto").classList.remove("hidden"); }
        function cerrarModalProducto() { document.getElementById("modal-agregar-producto").classList.add("hidden"); }
        function abrirModalMas() { document.getElementById("modal-menu-mas").classList.remove("hidden"); }
        function cerrarModalMas() { document.getElementById("modal-menu-mas").classList.add("hidden"); }
    </script>
