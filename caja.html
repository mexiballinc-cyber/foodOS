<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Food OS - POS Cajas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDD5YehD45blgPdbDCUEcwSnqBjdA_eZlE",
            authDomain: "food-os-system.firebaseapp.com",
            databaseURL: "https://food-os-system-default-rtdb.firebaseio.com",
            projectId: "food-os-system",
            storageBucket: "food-os-system.firebasestorage.app",
            messagingSenderId: "82413830766",
            appId: "1:82413830766:web:23da82e27ead8b8f2d1c7f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 🛡️ SESIÓN Y MULTI-TENANT DINÁMICO
        const currentSucursal = localStorage.getItem("foodos_sucursal") || "cubito_sushi";
        const usuarioActivo = localStorage.getItem("foodos_usuario") || "Empleado General"; 
        const esGerente = localStorage.getItem("foodos_es_gerente") === "true";
        
        const sucursalRef = `sucursales/${currentSucursal}`;

        // 🔥 INYECCIÓN CORREGIDA DEL NOMBRE DE LA SUCURSAL REAL
        const nombreSucursalFormateado = currentSucursal.replace(/_/g, " ").toUpperCase();
        document.getElementById("nombre-sucursal").innerText = nombreSucursalFormateado;
        document.getElementById("nombre-cajero").innerText = usuarioActivo;

        // Control de Gerente
        if (esGerente) {
            document.getElementById("btn-edit-mode")?.classList.remove("hidden");
            document.getElementById("badge-gerente")?.classList.remove("hidden");
            document.getElementById("seccion-modal-gerente")?.classList.remove("hidden");
        }

        // 📂 1. Categorías desde Firebase
        let menuCompleto = {};
        onValue(ref(db, `${sucursalRef}/categorias`), (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById("categories-bar");
            const selectModal = document.getElementById("prod-categoria");
            
            const addBtn = document.getElementById("btn-add-category");
            container.innerHTML = `<button onclick="filtrarCategoria('Todos')" class="btn-raised px-4 py-2 text-xs md:text-sm font-bold whitespace-nowrap">Todos</button>`;
            selectModal.innerHTML = "";

            if (data) {
                Object.keys(data).forEach(key => {
                    const cat = data[key];
                    container.innerHTML += `<button onclick="filtrarCategoria('${cat.nombre}')" class="btn-raised px-4 py-2 text-xs md:text-sm font-bold whitespace-nowrap">${cat.nombre}</button>`;
                    selectModal.innerHTML += `<option value="${cat.nombre}">${cat.nombre}</option>`;
                });
            }
            container.appendChild(addBtn);
        });

        // 📥 2. Menú desde Firebase
        onValue(ref(db, `${sucursalRef}/menu`), (snapshot) => {
            menuCompleto = snapshot.val() || {};
            renderizarProductos(menuCompleto);
        });

        window.renderizarProductos = function(productos) {
            const grid = document.getElementById("products-grid");
            grid.innerHTML = "";

            if (Object.keys(productos).length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-medium text-sm">El menú está vacío en ${nombreSucursalFormateado}.</div>`;
                return;
            }

            Object.keys(productos).forEach(id => {
                const item = productos[id];
                grid.innerHTML += `
                    <div onclick="agregarAlTicket('${item.nombre}', ${item.precio})" class="btn-raised p-3 flex flex-col justify-between h-32 md:h-40 cursor-pointer relative overflow-hidden group">
                        <img src="${item.foto}" class="absolute inset-0 w-full h-full object-cover opacity-20 group-hover:opacity-40 transition-opacity" />
                        <span class="text-[10px] md:text-xs font-bold uppercase tracking-wider text-amber-400 z-10">${item.categoria}</span>
                        <div class="z-10">
                            <p class="font-bold text-sm md:text-base leading-tight">${item.nombre}</p>
                            <p class="text-base md:text-lg font-black text-emerald-400 mt-1">$${item.precio} MXN</p>
                        </div>
                    </div>
                `;
            });
        };

        window.filtrarCategoria = function(nombreCat) {
            if (nombreCat === 'Todos') {
                renderizarProductos(menuCompleto);
            } else {
                const filtrados = {};
                Object.keys(menuCompleto).forEach(key => {
                    if (menuCompleto[key].categoria === nombreCat) filtrados[key] = menuCompleto[key];
                });
                renderizarProductos(filtrados);
            }
        };

        // ✏️ AÑADIR PLATILLO (Cierra modal al guardar)
        document.getElementById("form-nuevo-producto").addEventListener("submit", (e) => {
            e.preventDefault();
            const nuevoPlatillo = {
                nombre: document.getElementById("prod-nombre").value,
                precio: parseFloat(document.getElementById("prod-precio").value),
                categoria: document.getElementById("prod-categoria").value,
                foto: document.getElementById("prod-foto").value,
                ingredientes: document.getElementById("prod-ingredientes").value
            };

            push(ref(db, `${sucursalRef}/menu`), nuevoPlatillo).then(() => {
                document.getElementById("form-nuevo-producto").reset();
                cerrarModalProducto();
            });
        });

        window.guardarCategoriaServer = function() {
            const nombre = prompt("Nombre de la nueva categoría:");
            if (nombre) push(ref(db, `${sucursalRef}/categorias`), { nombre });
        };

        window.cerrarSesion = function() {
            localStorage.clear();
            window.location.href = "index.html";
        };
    </script>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e2640 100%);
            --text-color: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --shadow-raised: 6px 6px 12px rgba(0, 0, 0, 0.4), -3px -3px 8px rgba(255, 255, 255, 0.05);
            --shadow-sunken: inset 3px 3px 6px rgba(0, 0, 0, 0.5), inset -2px -2px 4px rgba(255, 255, 255, 0.05);
        }

        .light-mode {
            --bg-gradient: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            --text-color: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.8);
            --shadow-raised: 5px 5px 10px rgba(0, 0, 0, 0.15), -3px -3px 8px rgba(255, 255, 255, 0.9);
            --shadow-sunken: inset 3px 3px 5px rgba(0, 0, 0, 0.15), inset -2px -2px 4px rgba(255, 255, 255, 0.8);
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
        }

        .btn-raised {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: var(--shadow-raised);
        }

        .btn-sunken {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            box-shadow: var(--shadow-sunken);
        }
    </style>
</head>
<body class="p-2 md:p-4 flex flex-col gap-3 h-screen overflow-hidden">

    <!-- HEADER DINÁMICO -->
    <header class="glass-panel h-14 md:h-16 px-4 md:px-6 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-2 md:gap-3 overflow-hidden">
            <span class="text-xl md:text-2xl">🍣</span>
            <div class="flex flex-col">
                <!-- AHORA LEE EL LOCAL DE MANERA DINÁMICA DE VERDAD -->
                <h1 class="text-xs md:text-lg font-black truncate text-amber-400" id="nombre-sucursal">CARGANDO LOCAL...</h1>
                <div class="flex items-center gap-1">
                    <span class="text-[10px] md:text-xs text-slate-300 font-bold" id="nombre-cajero">Cajero</span>
                    <span id="badge-gerente" class="hidden text-[9px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full font-extrabold uppercase">Gerente</span>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button id="btn-edit-mode" onclick="toggleModoEdicion()" class="hidden w-9 h-9 md:w-11 md:h-11 btn-sunken flex items-center justify-center text-base md:text-lg text-amber-400" title="Modo Gerente">✏️</button>
            <button onclick="toggleTema()" id="btn-theme" class="w-9 h-9 md:w-11 md:h-11 btn-sunken flex items-center justify-center text-base md:text-lg">🌙</button>
            <button onclick="cerrarSesion()" class="w-9 h-9 md:w-11 md:h-11 btn-sunken flex items-center justify-center text-base md:text-lg text-rose-400">✕</button>
        </div>
    </header>

    <!-- PANEL PRINCIPAL -->
    <main class="flex-1 flex flex-col md:flex-row gap-3 overflow-hidden">
        
        <!-- COMANDA TICKET -->
        <section class="glass-panel w-full md:w-5/12 h-1/2 md:h-full flex flex-col p-3 md:p-5 gap-2 shrink-0">
            <div class="flex justify-between items-center border-b border-white/10 pb-2">
                <h2 class="text-base md:text-xl font-black">info orden</h2>
                <span class="text-[10px] text-slate-400">Doble clic para nota</span>
            </div>

            <div id="ticket-items" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
            
            <div class="border-t border-white/10 pt-2">
                <div class="flex justify-between items-baseline mb-2">
                    <span class="text-xs uppercase font-bold opacity-70">Total MXN</span>
                    <span class="text-2xl md:text-3xl font-black text-emerald-400" id="total-mxn">$0.00</span>
                </div>
                
                <div class="grid grid-cols-3 gap-1.5 text-[10px] md:text-xs">
                    <button class="btn-raised py-2 font-bold uppercase">Domicilio</button>
                    <button class="btn-raised py-2 font-bold uppercase">Llevar</button>
                    <button class="btn-raised py-2 font-bold uppercase">Comedor</button>
                    <button class="btn-raised py-2 font-bold uppercase text-sky-400">Enviar</button>
                    <button class="btn-raised py-2 font-bold uppercase text-emerald-400">Pago</button>
                    <button onclick="abrirModalMas()" class="btn-raised py-2 text-base font-bold text-amber-300 bg-amber-500/10">+</button>
                </div>
            </div>
        </section>

        <!-- PANEL PRODUCTOS -->
        <section class="glass-panel w-full md:w-7/12 h-1/2 md:h-full flex flex-col p-3 md:p-5 gap-3 overflow-hidden">
            <div class="flex items-center gap-2 overflow-x-auto pb-1 shrink-0" id="categories-bar">
                <button onclick="filtrarCategoria('Todos')" class="btn-raised px-4 py-2 text-xs md:text-sm font-bold whitespace-nowrap">Todos</button>
                <button id="btn-add-category" onclick="guardarCategoriaServer()" class="hidden btn-sunken px-3 py-1.5 text-amber-400 font-bold text-xs shrink-0">+ Categoria</button>
            </div>

            <div class="flex-1 overflow-y-auto pr-1">
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 md:gap-3" id="products-grid"></div>
            </div>
        </section>
    </main>

    <!-- MODAL MENU (+ MÁS) -->
    <div id="modal-menu-mas" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="glass-panel w-full max-w-sm p-5 space-y-3">
            <div class="flex justify-between items-center border-b border-white/10 pb-2">
                <h3 class="text-base font-black text-amber-300">Opciones POS</h3>
                <button onclick="cerrarModalMas()" class="btn-sunken w-7 h-7 text-xs">✕</button>
            </div>
            
            <div class="space-y-2 text-xs font-bold">
                <button class="btn-raised w-full p-3 text-left">📜 Todas las Órdenes del Día</button>
                <button class="btn-raised w-full p-3 text-left">🛵 Pedidos Repas & Puente</button>
                <button class="btn-raised w-full p-3 text-left text-emerald-400">💵 Realizar Corte de Caja</button>

                <div id="seccion-modal-gerente" class="hidden border-t border-white/10 pt-2 space-y-2">
                    <p class="text-[10px] text-amber-400 uppercase tracking-widest">Admin Gerente</p>
                    <button class="btn-raised w-full p-3 text-left text-amber-300">👥 Gestión de Empleados</button>
                    <button class="btn-raised w-full p-3 text-left text-amber-300">🍳 Configuración de Cocinas</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL AGREGAR PLATILLO -->
    <div id="modal-agregar-producto" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="glass-panel w-full max-w-md p-5 space-y-3">
            <h3 class="text-lg font-black text-amber-400 border-b border-white/10 pb-2">➕ Nuevo Platillo</h3>
            <form id="form-nuevo-producto" class="space-y-2 text-xs md:text-sm">
                <input type="text" id="prod-nombre" required class="btn-sunken w-full px-3 py-2 text-white outline-none" placeholder="Nombre">
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="prod-precio" step="0.01" required class="btn-sunken w-full px-3 py-2 text-white outline-none" placeholder="Precio ($ MXN)">
                    <select id="prod-categoria" class="btn-sunken w-full px-3 py-2 text-white outline-none bg-slate-900"></select>
                </div>
                <input type="url" id="prod-foto" required class="btn-sunken w-full px-3 py-2 text-white outline-none" placeholder="URL Foto Imagen">
                <textarea id="prod-ingredientes" rows="2" class="btn-sunken w-full p-2 text-white outline-none" placeholder="Ingredientes..."></textarea>
                
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="cerrarModalProducto()" class="btn-raised w-1/2 py-2 font-bold">Cancelar</button>
                    <button type="submit" class="btn-raised w-1/2 py-2 font-bold text-amber-300 bg-amber-500/20">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT TICKET Y NOTAS -->
    <script>
        let ticketArray = [];
        let esModoClaro = false;

        function toggleTema() {
            esModoClaro = !esModoClaro;
            document.body.classList.toggle("light-mode");
            document.getElementById("btn-theme").innerText = esModoClaro ? "☀️" : "🌙";
        }

        function toggleModoEdicion() { abrirModalProducto(); }

        function agregarAlTicket(nombre, precio) {
            const item = { id: Date.now(), nombre, precio, nota: "" };
            ticketArray.push(item);
            renderizarTicket();
        }

        function eliminarDelTicket(id) {
            ticketArray = ticketArray.filter(i => i.id !== id);
            renderizarTicket();
        }

        function agregarNotaItem(id) {
            const item = ticketArray.find(i => i.id === id);
            if (item) {
                const nota = prompt(`Nota de cocina para ${item.nombre}:`, item.nota);
                if (nota !== null) {
                    item.nota = nota;
                    renderizarTicket();
                }
            }
        }

        function renderizarTicket() {
            const ticketContainer = document.getElementById("ticket-items");
            ticketContainer.innerHTML = "";
            let total = 0;

            ticketArray.forEach(item => {
                total += item.precio;
                ticketContainer.innerHTML += `
                    <div ondblclick="agregarNotaItem(${item.id})" class="flex flex-col btn-sunken p-2 text-xs relative group cursor-pointer">
                        <div class="flex justify-between items-center">
                            <span class="font-bold truncate max-w-[140px]">${item.nombre}</span>
                            <div class="flex items-center gap-2">
                                <span class="font-black text-amber-400">$${item.precio}</span>
                                <button onclick="eliminarDelTicket(${item.id})" class="text-rose-400 font-bold hover:scale-125 transition-transform px-1">✕</button>
                            </div>
                        </div>
                        ${item.nota ? `<span class="text-[10px] text-sky-300 italic font-semibold mt-0.5">📝 ${item.nota}</span>` : ''}
                    </div>
                `;
            });

            document.getElementById("total-mxn").innerText = `$${total.toFixed(2)}`;
        }

        function abrirModalProducto() { document.getElementById("modal-agregar-producto").classList.remove("hidden"); }
        function cerrarModalProducto() { document.getElementById("modal-agregar-producto").classList.add("hidden"); }
        function abrirModalMas() { document.getElementById("modal-menu-mas").classList.remove("hidden"); }
        function cerrarModalMas() { document.getElementById("modal-menu-mas").classList.add("hidden"); }
    </script>
</body>
</html>
