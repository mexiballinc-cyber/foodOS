<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Food OS - Inicio</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/eZ3pxwv.png">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

    <div id="welcome-screen" class="screen active">
        <div class="logo-container">
            <img src="https://i.imgur.com/U0xdLiV.png" alt="Food OS Logo" class="food-os-logo">
        </div>
        <button id="btn-iniciar" onclick="abrirEscaner()">Iniciar</button>
    </div>

    <div id="scanner-screen" class="screen hidden">
        <div class="glass-card scanner-card">
            <div id="reader-container">
                <div id="reader"></div>
            </div>

            <div class="pin-container">
                <p class="pin-instruction">Ingresar PIN de Empleado</p>
                <input type="password" id="pin-display" readonly maxlength="4">
                
                <div class="keypad">
                    <button onclick="pressPin('1')">1</button>
                    <button onclick="pressPin('2')">2</button>
                    <button onclick="pressPin('3')">3</button>
                    <button onclick="pressPin('4')">4</button>
                    <button onclick="pressPin('5')">5</button>
                    <button onclick="pressPin('6')">6</button>
                    <button onclick="pressPin('7')">7</button>
                    <button onclick="pressPin('8')">8</button>
                    <button onclick="pressPin('9')">9</button>
                    <button onclick="actionExitOrClear()" class="btn-action">✕</button>
                    <button onclick="pressPin('0')">0</button>
                    <button onclick="submitPin()" class="btn-action btn-ok">✓</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
