<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Food OS</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/eZ3pxwv.png">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

    <!-- PANTALLA 1: BIENVENIDA & LISTA DE NEGOCIOS GUARDADOS -->
    <div id="welcome-screen" class="screen active">
        <div class="logo-container">
            <img src="https://i.imgur.com/U0xdLiV.png" alt="Food OS Logo" class="food-os-logo">
        </div>

        <div id="saved-businesses-section" class="hidden glass-card saved-biz-wrapper">
            <p class="subtitle" style="margin-bottom:10px; font-weight:bold; color:#ff8800;">🏢 MIS NEGOCIOS REGISTRADOS</p>
            <div id="saved-businesses-list" class="saved-biz-container"></div>
            <button class="btn-add-new-biz" onclick="abrirEscaner()">➕ Añadir Nuevo Negocio</button>
        </div>

        <button id="btn-iniciar" onclick="abrirEscaner()">Iniciar</button>
    </div>

    <!-- PANTALLA 2: LECTOR QR / ENTRADA CÓDIGO -->
    <div id="scanner-screen" class="screen hidden">
        <div class="glass-card scanner-card">
            <div class="qr-icon-header">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ff6b00" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7" rx="2"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="2"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="2"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="2"></rect>
                </svg>
            </div>
            <h2>Escanear Código QR</h2>
            <p class="subtitle">Coloque el QR del local frente a la cámara</p>
            
            <div class="qr-viewport-wrapper">
                <div id="reader"></div>
            </div>

            <div class="divider"><span>o ingresa tu clave</span></div>

            <div class="manual-input">
                <input type="text" id="manual-token" placeholder="Ingresa tu código de acceso" autocomplete="off">
                <button onclick="validarTokenManual()">Acceder</button>
            </div>
        </div>
    </div>

    <!-- PANTALLA 3: LOCKSCREEN -->
    <div id="lockscreen" class="screen hidden">
        
        <!-- BOTÓN DE SALIR (X) A PANTALLA DE INICIO -->
        <button onclick="actionExitOrClear()" style="position: absolute; top: 20px; left: 20px; z-index: 10;" class="theme-picker" title="Regresar al Inicio">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>

        <div style="position: absolute; bottom: 25px; right: 25px; display: flex; gap: 12px; z-index: 10;">
            <button class="theme-picker" onclick="abrirEscaner()" title="Escanear QR Gerente">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                </svg>
            </button>
            
            <button class="theme-picker" onclick="cambiarFondoLockscreen()" title="Cambiar Fondo">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 2a7 7 0 1 0 10 10"></path>
                </svg>
            </button>
        </div>

        <div class="lockscreen-content">
            <div class="clock-section">
                <div class="clock" id="clock-display">00:00</div>
                <p id="business-title">Cargando datos...</p>
            </div>

            <div class="pin-card glass-card">
                <!-- ENCABEZADO CON BOTÓN DE RELOJ CHECADOR VISIBLE -->
                <div style="display: flex; justify-content: space-between; items-center; align-items: center; margin-bottom: 8px;">
                    <span class="pin-instruction" style="margin:0;">Ingresar PIN</span>
                    <button onclick="abrirRelojChecador()" style="background: rgba(245, 158, 11, 0.2); border: 1px solid rgba(245, 158, 11, 0.5); color: #f59e0b; border-radius: 12px; padding: 4px 10px; font-size: 0.75rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span>Checar</span>
                    </button>
                </div>
                
                <input type="password" id="pin-display" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
                
                <div class="keypad">
                    <button onclick="pressPin('1')">1</button>
                    <button onclick="pressPin('2')">2</button>
                    <button onclick="pressPin('3')">3</button>
                    <button onclick="pressPin('4')">4</button>
                    <button onclick="pressPin('5')">5</button>
                    <button onclick="pressPin('6')">6</button>
                    <button onclick="pressPin('7')">7</button>
                    <button onclick="pressPin('8')">8</button>
                    <button onclick="pressPin('9')">9</button>
                    <button onclick="actionExitOrClear()" class="btn-action">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    </button>
                    <button onclick="pressPin('0')">0</button>
                    <button onclick="submitPin()" class="btn-action btn-ok">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
